name: Keep Supabase Awake
on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every single day at midnight
  workflow_dispatch: # Allows you to manually trigger it anytime to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database
        run: curl -I "${{ secrets.SUPABASE_URL }}"
