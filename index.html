<!-- Local library fallback -->
    <script src="supabase.js"></script>
    <script>
        // Replace these with your live project credentials from your dashboard settings if testing on live DB
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_vrrhssTESxjPVkAMyVIhag_JQBd6FIk";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const logBox = document.getElementById('output');

        async function saveProfile() {
            const id = document.getElementById('userId').value;
            const name = document.getElementById('name').value;
            const bio = document.getElementById('bio').value;
            const skills = document.getElementById('skills').value;
            if(!id) { alert('Please enter a User ID'); return; }

            const { data, error } = await supabaseClient
                .from('UserProfiles')
                .upsert({ id: id, name: name, bio: bio, skills: skills })
                .select();
            if (error) { logBox.innerText = "Error: " + error.message; } 
            else { logBox.innerText = "Success! Profile saved:\n" + JSON.stringify(data, null, 2); }
        }

        async function fetchProfile() {
            const id = document.getElementById('userId').value;
            if(!id) { alert('Please enter a User ID'); return; }

            const { data, error } = await supabaseClient
                .from('UserProfiles')
                .select('*')
                .eq('id', id);
                
            if (error) { logBox.innerText = "Error: " + error.message; } 
            else if (!data || data.length === 0) { logBox.innerText = "No profile found matching ID."; }
            else { 
                logBox.innerText = "Profile Found:\n" + JSON.stringify(data, null, 2); 
                document.getElementById('name').value = data[0].name || '';
                document.getElementById('bio').value = data[0].bio || '';
                document.getElementById('skills').value = data[0].skills || '';
            }
        }

        async function removeProfile() {
            const id = document.getElementById('userId').value;
            if(!id) { alert('Please enter a User ID'); return; }

            const { error } = await supabaseClient
                .from('UserProfiles')
                .delete()
                .eq('id', id);
                
            if (error) { logBox.innerText = "Error: " + error.message; } 
            else { 
                logBox.innerText = `Profile ${id} removed successfully.`; 
                document.getElementById('name').value = '';
                document.getElementById('bio').value = '';
                document.getElementById('skills').value = '';
            }
        }
    </script>
</body>
</html>
